# fly.toml app configuration file generated for topline on 2026-10-18T15:20:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'topline'
primary_region = 'ams'

[build]

[deploy]
  release_command = 'alembic upgrade head'

[env]
  APP_ENV = 'production'
  DOCUMENT_STORAGE_DIR = '/data/documents'
  MPESA_CALLBACK_URL = 'https://topline-jobs.fly.dev/api/v1/payments/mpesa/callback'
  MPESA_ENVIRONMENT = 'sandbox'
  OTP_PROVIDER = 'none'

[[mounts]]
  source = 'topline_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
